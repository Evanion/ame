name: Crafting data

# Keeps the crafting data library (AzerothMercantileExchange_Crafting) in step with the game, hands-off:
#   1. once a day, ask wago.tools for the latest WoW Forever build (one small request)
#   2. a build already handled (remembered in the Actions cache, with the generator's version) ends the run
#   3. otherwise regenerate the data; data the same as main's ends the run
#   4. changed data is checked (the shrink guard in the generator, the crafting data specs) and goes to main as a
#      pull request ("fix(data): ..."), opened with RELEASE_PLEASE_TOKEN so CI runs on it and it counts as the
#      owner's. Once its checks pass, this job merges it; the merge releases the data (crafting-data-release.yml).
#   5. any failure opens an issue instead
# Secret: RELEASE_PLEASE_TOKEN (the owner's fine-grained token, as for AME's releases).

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Open the pull request even if this build was handled already"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency: crafting-data

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Latest WoW Forever build
        id: build
        run: echo "build=$(python3 scripts/gen-recipes.py --latest)" >> "$GITHUB_OUTPUT"

      - name: Handled this build already?
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: .cache/handled
          key: crafting-data-${{ steps.build.outputs.build }}-${{ hashFiles('scripts/gen-recipes.py') }}
          lookup-only: true

      - name: Generate
        id: gen
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force
        run: |
          python3 scripts/gen-recipes.py --build "${{ steps.build.outputs.build }}" --summary "$RUNNER_TEMP/summary.md"
          if git diff --quiet -- AzerothMercantileExchange_Crafting; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Build ${{ steps.build.outputs.build }}: main's crafting data is current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Lua 5.1 and busted
        if: steps.gen.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install busted

      - name: Check the data
        if: steps.gen.outputs.changed == 'true'
        run: busted spec/crafting_data_spec.lua

      - name: Open the pull request and merge it once its checks pass
        if: steps.gen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          BRANCH="data/build-$BUILD-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add AzerothMercantileExchange_Crafting
          git commit -q -m "fix(data): crafting data for WoW Forever build $BUILD"
          git push -q origin "$BRANCH"
          URL=$(gh pr create --base main --head "$BRANCH" \
            --title "fix(data): crafting data for WoW Forever build $BUILD" \
            --body-file "$RUNNER_TEMP/summary.md")
          echo "Opened $URL" >> "$GITHUB_STEP_SUMMARY"
          sleep 30 # let the checks start
          gh pr checks "$URL" --watch --required --interval 30
          gh pr merge "$URL" --squash --admin --delete-branch
          echo "Merged: the release follows (Crafting data release)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remember the build
        if: steps.seen.outputs.cache-hit != 'true'
        run: mkdir -p .cache/handled && echo "${{ steps.build.outputs.build }}" > .cache/handled/build

      - uses: actions/cache/save@v4
        if: steps.seen.outputs.cache-hit != 'true'
        with:
          path: .cache/handled
          key: crafting-data-${{ steps.build.outputs.build }}-${{ hashFiles('scripts/gen-recipes.py') }}

      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Crafting data update failed (WoW Forever build ${{ steps.build.outputs.build }})" \
            --body "The scheduled crafting data update failed; nothing was merged or released. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
