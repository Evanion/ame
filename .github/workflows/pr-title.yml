name: PR title

# Pull requests are squash-merged, so the title becomes the commit on main or a release branch, and release-please
# reads it to pick the next version and write the changelog. The title must be a conventional commit:
#   feat: ...   a new feature (changelog: New)          fix: ...    a bug fix (changelog: Fixes)
#   perf: ...   faster or lighter (changelog: Faster)   revert: ... (changelog: Reverted)
#   docs, style, refactor, test, build, ci, chore       no changelog entry
# A "!" after the type (feat!: ...) or a BREAKING CHANGE footer marks a breaking change.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            style
            refactor
            test
            build
            ci
            chore
          requireScope: false
